name: Quest 3 Android ARM64 build

on:
  pull_request:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "runtime/**"
      - "tools/build_android.sh"
      - "android/**"
      - ".github/workflows/quest3-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Build Quest-compatible ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip unzip python3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and packaging tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Fetch Vulkan headers
        run: |
          curl -fsSL "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.357.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          echo "VULKAN_HEADERS=$RUNNER_TEMP/Vulkan-Headers-1.4.357" >> "$GITHUB_ENV"

      - name: Configure, compile, and package ARM64 APK
        run: |
          tools/build_android.sh --no-game --jobs 2
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          NX_VULKAN_SDK: ${{ env.VULKAN_HEADERS }}

      - name: Verify APK architecture and OpenXR loader
        run: |
          APK=private/acnh/apk-app/acnh.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libacnh.so"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libopenxr_loader.so"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package:"
          echo "ARM64 APK packaging verification passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quest3-openxr-arm64-apk
          path: private/acnh/apk-app/acnh.apk
          if-no-files-found: error
          retention-days: 14
